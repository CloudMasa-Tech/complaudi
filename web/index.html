<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The Complaudi mark, cropped from the wordmark artwork in public/logo.png
         rather than redrawn, so the tab and the sidebar carry the same symbol.
         Several sizes: a browser picks one and downscaling a 180px icon to 16px
         in the tab strip turns the document glyph inside the mark to mush.
         /favicon.ico is requested by some browsers whether it is declared or
         not, so it exists too. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1b3a6b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's display mode; these are how an installed
         icon on the home screen opens without Safari's chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Complaudi" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything but 0 on a notched phone. Without it the layout is padded
         against a notch that CSS reports as having no size. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Static, so it cannot read BRAND_TAGLINE from Layout.tsx — keep the two in step by hand. -->
    <title>Complaudi — An AI Platform for compliance Audit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
